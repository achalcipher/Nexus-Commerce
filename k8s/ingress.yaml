apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-commerce-ingress
  labels:
    app: nexus-commerce
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: storefront.nexus-commerce.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nexus-frontend-service
            port:
              number: 80
  - host: api.nexus-commerce.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nexus-backend-service
            port:
              number: 5000
  tls:
  - hosts:
    - storefront.nexus-commerce.com
    - api.nexus-commerce.com
    secretName: nexus-commerce-tls